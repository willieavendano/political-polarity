# =============================================================================
# Political Polarity Analysis - Default Configuration
# =============================================================================
# WARNING: This system classifies TEXT CONTENT, not individuals.
# Do NOT use outputs to infer any individual's political beliefs.
# See MODEL_CARD.md for full ethical guidance.
# =============================================================================

random_seed: 42

# --- Data Paths ---
data:
  raw_dir: "./data/raw"
  processed_dir: "./data/processed"
  labels_dir: "./data/labels"
  artifacts_dir: "./artifacts"
  # Outlet-level bias labels (CSV: outlet_name, label)
  outlet_bias_file: "./data/labels/outlet_bias.csv"
  # Optional human labels (CSV: doc_id, label)
  human_labels_file: "./data/labels/human_labels.csv"

# --- Preprocessing ---
preprocessing:
  min_doc_length: 50          # characters
  max_doc_length: 50000       # characters
  language: "en"
  dedup_enabled: true
  normalize_unicode: true
  remove_boilerplate: true
  stopword_removal_classic: true   # only for classic ML features
  stopword_removal_transformer: false

# --- Feature Extraction ---
features:
  tfidf:
    max_features: 30000
    ngram_range: [1, 3]
    min_df: 3
    max_df: 0.95
    sublinear_tf: true
  keyword_extraction:
    top_k: 20
    # chi2 or mutual_info
    method: "chi2"
  embedding:
    model_name: "all-MiniLM-L6-v2"  # sentence-transformers model
    # fallback to TF-IDF cosine if sentence-transformers unavailable

# --- Baseline Model ---
baseline:
  model_type: "logistic_regression"   # or "linear_svm"
  C: 1.0
  max_iter: 1000
  calibration: "sigmoid"              # "sigmoid" (Platt) or "isotonic"
  top_features_per_class: 50

# --- Transformer Model ---
transformer:
  model_name: "distilbert-base-uncased"
  max_length: 512
  batch_size: 16
  learning_rate: 2.0e-5
  weight_decay: 0.01
  num_epochs: 5
  early_stopping_patience: 2
  warmup_ratio: 0.1
  fp16: false                          # set true if GPU supports it
  cpu_friendly: true                   # use smaller batches, fewer epochs on CPU
  cpu_batch_size: 4
  cpu_num_epochs: 2
  interpretability:
    method: "leave_one_out"            # "leave_one_out" or "attention"
    top_k_tokens: 15

# --- Evaluation ---
evaluation:
  test_size: 0.15
  val_size: 0.15
  stratify_by_source: true
  temporal_split: false                # if true, split by date
  temporal_split_date: "2024-01-01"
  calibration_bins: 10
  save_misclassified: true
  max_misclassified_saved: 200

# --- Subset / Aggregation ---
subset:
  k_anonymity: 30                      # minimum group size
  polarity_score: "difference"         # P(right) - P(left)
  top_phrases_per_subset: 20
  # Which metadata fields to aggregate by
  group_by_fields: ["source", "region"]

# --- Labels ---
labels:
  classes: ["left", "center", "right"]
  class_to_int:
    left: 0
    center: 1
    right: 2
  int_to_class:
    0: "left"
    1: "center"
    2: "right"

# --- Semi-supervised (Tier 3) ---
semi_supervised:
  enabled: false
  confidence_threshold: 0.85
  consistency_rounds: 3
  holdout_fraction: 0.1
  max_new_labels_per_round: 500
  calibration_check: true

# --- Logging ---
logging:
  level: "INFO"
  log_file: "./artifacts/run.log"
