[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "political-polarity"
version = "0.1.0"
description = "NLP system for measuring political polarity in text corpora"
requires-python = ">=3.10,<3.13"
license = {text = "MIT"}
dependencies = [
    "numpy==1.26.4",
    "pandas==2.2.1",
    "scikit-learn==1.4.1.post1",
    "scipy==1.12.0",
    "matplotlib==3.8.3",
    "pyyaml==6.0.1",
    "torch==2.2.1",
    "transformers==4.38.2",
    "datasets==2.18.0",
    "accelerate==0.27.2",
    "langdetect==1.0.9",
    "beautifulsoup4==4.12.3",
    "tqdm==4.66.2",
    "gradio==4.19.2",
]

[project.optional-dependencies]
dev = [
    "pytest==8.0.2",
    "pytest-cov==4.1.0",
]

[tool.setuptools.packages.find]
include = ["polarity*", "scripts*"]
